<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>crime_scene</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>crime_scene</h1>
    <p>Diagram scenes with wall tools, snapping, and scene controls.</p>
  </header>

  <nav class="top-toolbar" aria-label="Main toolbar">
    <div class="toolbar-section">
      <span class="section-title">Primary Mode Tools</span>
      <button data-tool="select" class="tool-btn active">Select</button>

      <div class="wall-dropdown-wrap">
        <button data-tool="wall" class="tool-btn" id="wallToolBtn">Wall</button>
        <select id="wallModeDropdown" aria-label="Wall mode">
          <option value="free">Free Wall</option>
          <option value="straight">Straight Wall</option>
        </select>
      </div>

      <button data-tool="room" class="tool-btn">Room</button>
      <button data-tool="measure" class="tool-btn">Measure</button>
    </div>

    <div class="toolbar-section compact">
      <span class="section-title">Snap Toggles</span>
      <button id="toggleSnapGrid" class="icon-toggle">SG</button>
      <button id="toggleSnapWalls" class="icon-toggle">SW</button>
      <button id="toggleOrtho" class="icon-toggle">O</button>
    </div>

    <div class="toolbar-section scene-controls">
      <span class="section-title">Scene Controls</span>
      <label>
        Scale
        <select id="scalePreset">
          <option value="6in">1 sq = 6 inches</option>
          <option value="1ft" selected>1 sq = 1 foot</option>
          <option value="2ft">1 sq = 2 feet</option>
          <option value="custom">Custom</option>
        </select>
      </label>
      <div id="customScaleWrap" class="inline-row hidden">
        <input id="customScaleValue" type="number" min="0.1" step="0.1" value="1" />
        <select id="customScaleUnit">
          <option value="in">inches</option>
          <option value="ft" selected>feet</option>
        </select>
      </div>
      <label>
        Export
        <select id="exportDropdown">
          <option value="json">Export JSON</option>
          <option value="png">Export PNG</option>
        </select>
      </label>
      <button id="runExport">Export</button>
      <button id="undoBtn">Undo</button>
      <button id="redoBtn">Redo</button>
    </div>
  </nav>

  <main>
    <aside class="panel">
      <h2>Case Info</h2>
      <label>Case Number <input id="caseNumber" placeholder="2026-001" /></label>
      <label>Scene Name <input id="sceneName" placeholder="Living Room" /></label>

      <h2>Selected Evidence</h2>
      <label>Evidence ID <input id="evidenceId" placeholder="E-01" /></label>
      <label>Notes <textarea id="evidenceNotes" rows="3" placeholder="Description..."></textarea></label>
      <button id="saveEvidence">Save Evidence</button>

      <h2>Wall Properties</h2>
      <div id="wallPropertiesEmpty" class="muted">Select a wall to edit properties.</div>
      <div id="wallPropertiesPanel" class="hidden">
        <label>Length <input id="wallLength" readonly /></label>
        <label>Angle <input id="wallAngle" readonly /></label>
        <label>Thickness (px) <input id="wallThickness" type="number" min="1" value="4" /></label>
        <label>Label <input id="wallLabel" placeholder="W1" /></label>
        <label>
          Type
          <select id="wallType">
            <option value="interior">Interior</option>
            <option value="exterior">Exterior</option>
          </select>
        </label>
        <button id="saveWallProperties">Save Wall Properties</button>
      </div>

      <h2>Offset / Parallel Wall</h2>
      <label>Offset distance (scene units) <input id="offsetDistance" type="number" min="0.1" step="0.1" value="12" /></label>
      <button id="createOffsetWall">Create Parallel Wall from Selected</button>

      <h2>Scene</h2>
      <button id="clearScene" class="danger">Clear Scene</button>
    </aside>

    <section class="canvas-wrap">
      <canvas id="sceneCanvas" width="1200" height="760" aria-label="Crime scene diagram canvas"></canvas>
      <div id="status">Tool: Select</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
